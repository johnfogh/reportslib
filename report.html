<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Session summary</title>
<style>

:root {
  --bg: #1b1b1b;
  --panel: #242424;
  --fg: #efebdc;
  --muted: #817f68;
  --accent: #e75a50;
  --border: #3a3a3a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
}
.report {
  max-width: 56rem;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
}
.report:has(.main-section),
.report:has(.data-section) {
  max-width: 72rem;
}
header.page {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1rem;
  margin-bottom: 1.5rem;
}
header.page h1 {
  margin: 0 0 0.5rem;
  font-size: 1.6rem;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 1.25rem;
  color: var(--muted);
  font-size: 0.9rem;
}
.meta dt { font-weight: 600; color: var(--accent); display: inline; }
.meta dd { display: inline; margin: 0; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.4rem 0 0.6rem; }
p { margin: 0.6rem 0; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.75rem 0 1.25rem;
  font-size: 0.95rem;
}
th, td {
  border: 1px solid var(--border);
  padding: 0.45rem 0.65rem;
  text-align: left;
  vertical-align: top;
}
th { background: var(--panel); }
tr:nth-child(even) td { background: #1f1f1f; }
img.report-img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0.75rem 0 1.25rem;
  border: 1px solid var(--border);
  border-radius: 6px;
}
ul, ol { margin: 0.5rem 0 1rem; padding-left: 1.4rem; }
li { margin: 0.25rem 0; }
.block-html { margin: 0.75rem 0 1.25rem; }

.main-section { margin: 0.75rem 0 1.5rem; }
.main-section > h2 {
  margin: 0 0 0.75rem;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.tgt-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: stretch;
  margin-bottom: 1.5rem;
}
.tgt-grid.is-grid {
  display: grid;
  gap: 0.5rem;
}
.tgt-card {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding: 0.4rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  min-width: 12rem;
  min-height: 0;
}
.tgt-card.distance {
  align-items: center;
  justify-content: center;
  min-width: 0;
  color: var(--fg);
  font-size: 0.95rem;
}
.tgt-card .def {
  color: var(--muted);
  font-size: 0.85rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tgt-card .body {
  display: flex;
  flex-direction: row;
  gap: 0.4rem;
  align-items: flex-start;
  min-width: 0;
}
.tgt-card .preview {
  flex: 1;
  min-width: 0;
}
.tgt-card .preview img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #111;
}
.tgt-card .zones {
  flex: none;
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 0.8rem;
  color: var(--muted);
  max-height: 10rem;
  overflow: auto;
}
.tgt-card .zones li { margin: 0.1rem 0; white-space: nowrap; }
.tgt-card .empty {
  color: var(--muted);
  font-size: 0.85rem;
  padding: 1rem 0.5rem;
  text-align: center;
}

.timeline {
  margin-top: 0.5rem;
  padding: 0.75rem 0.25rem 0.25rem;
}
.timeline .track {
  position: relative;
  height: 4.5rem;
  margin: 0 0.75rem;
  border-bottom: 2px solid var(--border);
}
.timeline .track::before {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--border);
}
.timeline .marker {
  position: absolute;
  bottom: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  width: max-content;
  max-width: 7rem;
}
.timeline .marker .dot {
  width: 0.7rem;
  height: 0.7rem;
  border-radius: 50%;
  border: 2px solid #fff;
  background: var(--muted);
  margin-top: 0.35rem;
  transform: translateY(50%);
  box-shadow: 0 0 0 1px var(--border);
}
.timeline .marker.kind-message .dot { background: var(--accent); }
.timeline .marker .lbl {
  font-size: 0.72rem;
  color: var(--fg);
  text-align: center;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 7rem;
}
.timeline .marker .t {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 0.15rem;
}
.timeline .empty {
  color: var(--muted);
  font-size: 0.9rem;
  padding: 0.5rem 0;
}

.data-section { margin: 0.75rem 0 1.5rem; }
.data-section > h2 {
  margin: 0 0 0.75rem;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.data-section .data-json {
  margin: 0;
  padding: 0.85rem 1rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  color: var(--fg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  line-height: 1.45;
  white-space: pre-wrap;
  overflow-x: auto;
}
.data-section .empty {
  color: var(--muted);
  font-size: 0.9rem;
  padding: 0.5rem 0;
}

</style>
</head>
<body>
<article class="report">
<header class="page">
  <h1>Session summary</h1>
  <dl class="meta">
  <div><dt>Generated</dt> <dd>2026-10-18</dd></div>
  <div><dt>Course</dt> <dd>demo</dd></div>
</dl>
</header>
<h2>Overview</h2>
<p>Hits recorded during the session. This file is self-contained.</p>
<table>
<thead><tr><th>Device</th><th>Hits</th></tr></thead>
<tbody>
<tr><td>sensor-01</td><td>12</td></tr>
<tr><td>sensor-02</td><td>7</td></tr>
</tbody>
</table>
<h2>Overlay</h2>
<img class="report-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVQI12P4z8AAAAADAAEABf7U7wAAAABJRU5ErkJggg==" alt="sample overlay"/>
<ul>
  <li>No external CSS</li>
  <li>No external JS</li>
  <li>Images as data URIs</li>
</ul>
</article>
<script>
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
